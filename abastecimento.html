<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgroTrator - Abastecimento</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f7f5;
        }


        .celular {

            width: 390px;

            height: 844px;

            background: #f5f7f5;

            overflow: hidden;

            position: relative;

            border-radius: 25px;
        }


        /* CABEÇALHO */

        header {

            height: 85px;

            background: #087a35;

            color: white;

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 15px 20px;
        }


        .botao-voltar {

            color: white;

            text-decoration: none;

            font-size: 30px;

            line-height: 1;
        }


        header h1 {

            font-size: 21px;
        }


        /* CONTEÚDO */

        .conteudo {

            height: calc(100% - 85px);

            overflow-y: auto;

            padding: 20px;

            padding-bottom: 30px;
        }


        /* IMAGEM */

        .imagem-abastecimento {

            width: 100%;

            height: 180px;

            object-fit: cover;

            border-radius: 17px;

            display: block;

            margin-bottom: 18px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.10);
        }


        .titulo {

            color: #087a35;

            font-size: 25px;

            margin-bottom: 18px;
        }


        /* FORMULÁRIO */

        .campo {

            margin-bottom: 14px;
        }


        .campo label {

            display: block;

            color: #555;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 6px;
        }


        .campo input,
        .campo select {

            width: 100%;

            height: 48px;

            border: none;

            outline: none;

            background: white;

            border-radius: 11px;

            padding: 0 13px;

            font-size: 15px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        /* DUAS COLUNAS */

        .linha {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }


        /* RESUMO */

        .resumo {

            background: white;

            border-radius: 15px;

            padding: 15px;

            margin-top: 18px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }


        .resumo h2 {

            color: #087a35;

            font-size: 18px;

            margin-bottom: 12px;
        }


        .resumo-item {

            display: flex;

            justify-content: space-between;

            padding: 6px 0;

            color: #555;

            font-size: 14px;
        }


        .resumo-item strong {

            color: #222;
        }


        /* BOTÃO */

        .botao-registrar {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 11px;

            background: #087a35;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 18px;
        }


        .botao-registrar:hover {

            background: #06652c;
        }


        /* MENSAGEM */

        #mensagem {

            text-align: center;

            color: #087a35;

            font-weight: bold;

            margin-top: 12px;

            display: none;
        }

    </style>

</head>


<body>


<div class="celular">


    <!-- CABEÇALHO -->

    <header>

        <a
            href="detalhes.html"
            class="botao-voltar"
        >
            ←
        </a>

        <h1>
            Abastecimento
        </h1>

    </header>



    <!-- CONTEÚDO -->

    <main class="conteudo">


        <!-- IMAGEM -->

        <img
            src="imagens/imagens/abastecimento.jpg.jpg"
            alt="Abastecimento de trator"
            class="imagem-abastecimento"
        >


        <h2 class="titulo">
            Registrar abastecimento
        </h2>



        <!-- TRATOR -->

        <div class="campo">

            <label>
                Trator
            </label>

            <select id="trator">

                <option>
                    John Deere 6110
                </option>

                <option>
                    Massey Ferguson 4297
                </option>

                <option>
                    New Holland T7
                </option>

                <option>
                    Valtra A134
                </option>

            </select>

        </div>



        <!-- DATA E HORA -->

        <div class="linha">


            <div class="campo">

                <label>
                    Data
                </label>

                <input
                    type="date"
                    id="data"
                    value="2026-09-15"
                >

            </div>


            <div class="campo">

                <label>
                    Horímetro
                </label>

                <input
                    type="number"
                    id="horimetro"
                    value="1450"
                >

            </div>

        </div>



        <!-- LITROS E VALOR -->

        <div class="linha">


            <div class="campo">

                <label>
                    Litros
                </label>

                <input
                    type="number"
                    id="litros"
                    placeholder="Ex.: 180"
                    step="0.1"
                >

            </div>


            <div class="campo">

                <label>
                    Valor (R$)
                </label>

                <input
                    type="number"
                    id="valor"
                    placeholder="Ex.: 950"
                    step="0.01"
                >

            </div>

        </div>



        <!-- RESUMO -->

        <div class="resumo">

            <h2>
                Último abastecimento
            </h2>


            <div class="resumo-item">

                <span>
                    Trator
                </span>

                <strong>
                    John Deere 6110
                </strong>

            </div>


            <div class="resumo-item">

                <span>
                    Data
                </span>

                <strong>
                    15/09/2026
                </strong>

            </div>


            <div class="resumo-item">

                <span>
                    Litros
                </span>

                <strong>
                    180 L
                </strong>

            </div>


            <div class="resumo-item">

                <span>
                    Horímetro
                </span>

                <strong>
                    1450 h
                </strong>

            </div>

        </div>



        <!-- BOTÃO -->

        <button
            class="botao-registrar"
            onclick="registrarAbastecimento()"
        >
            ⛽ Registrar abastecimento
        </button>


        <p id="mensagem">
            Abastecimento registrado com sucesso!
        </p>


    </main>

</div>



<script>

    function registrarAbastecimento() {

        const litros =
            document.getElementById("litros").value;

        const valor =
            document.getElementById("valor").value;


        if (litros === "" || valor === "") {

            alert(
                "Preencha os litros e o valor."
            );

            return;
        }


        document.getElementById(
            "mensagem"
        ).style.display = "block";


        document.getElementById(
            "litros"
        ).value = "";


        document.getElementById(
            "valor"
        ).value = "";

    }

</script>


</body>

</html>
