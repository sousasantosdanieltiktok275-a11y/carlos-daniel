<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgroTrator</title>


    <style>

        /* ==============================
           CONFIGURAÇÃO GERAL
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            background: #f2f2f2;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

        }


        /* ==============================
           TELA DO APLICATIVO
        ============================== */

        .celular {

            width: 390px;

            height: 844px;

            position: relative;

            overflow: hidden;

            border-radius: 31px;

            background: #004d20;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.20);

        }


        /* ==============================
           IMAGEM DE FUNDO
        ============================== */

        .fundo {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            object-position: center;

            z-index: 1;

        }


        /* ==============================
           CONTEÚDO
        ============================== */

        .conteudo {

            position: relative;

            width: 100%;

            height: 100%;

            z-index: 2;

        }


        /* ==============================
           BARRA SUPERIOR
        ============================== */

        .status {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 35px;

            padding: 10px 16px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            color: white;

            font-size: 10px;

            font-weight: bold;

        }


        /* ==============================
           LOGO
        ============================== */

        .logo {

            position: absolute;

            top: 105px;

            left: 50%;

            transform: translateX(-50%);

            width: 180px;

            height: auto;

            object-fit: contain;

        }


        /* ==============================
           BOTÃO ENTRAR
        ============================== */

        .botao-entrar {

            position: absolute;

            bottom: 47px;

            left: 50%;

            transform: translateX(-50%);

            width: 184px;

            height: 42px;

            background: #F57C00;

            color: white;

            border-radius: 8px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            font-size: 14px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            box-shadow:
                0 3px 6px rgba(0, 0, 0, 0.20);

            transition: 0.2s;

        }


        .botao-entrar:hover {

            background: #d96500;

            transform:
                translateX(-50%)
                scale(1.03);

        }


        /* ==============================
           ÍCONE DO BOTÃO
        ============================== */

        .icone-entrar {

            font-size: 21px;

            line-height: 1;

        }


        /* ==============================
           RESPONSIVO
        ============================== */

        @media (max-width: 500px) {

            .celular {

                width: 92vw;

                max-width: 255px;

                height: 90vh;

                max-height: 553px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         TELA DO APLICATIVO
    ================================== -->

    <div class="celular">


        <!-- =================================
             IMAGEM DE FUNDO

             Arquivo:

             imagens/fundo-agro.png
        ================================== -->

        <img
            src="imagens/imagens/fundo-agro.png.png"
            alt="Fundo agrícola do AgroTrator"
            class="fundo"
        >


        <!-- =================================
             CONTEÚDO
        ================================== -->

        <div class="conteudo">


            <!-- BARRA SUPERIOR -->

            <div class="status">

                <span>9:41</span>

                <span>●● ▰</span>

            </div>


            <!-- =================================
                 LOGO

                 Arquivo:

                 imagens/logo.png
            ================================== -->

            <img
                src="imagens/imagens/logo.png.png"
                alt="Logo AgroTrator"
                class="logo"
            >


            <!-- =================================
                 BOTÃO ENTRAR

                 Ao clicar:

                 index.html
                       ↓
                 home.html
            ================================== -->

            <a
                href="home.html"
                class="botao-entrar"
            >

                <span class="icone-entrar">
                    ⇥
                </span>

                <span>
                    Entrar
                </span>

            </a>


        </div>

    </div>


</body>

</html>
